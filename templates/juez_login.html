<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Jurado - 1er Concurso de Huapango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; }
        .text-guinda { color: #691C32 !important; }
        .bg-verde { background-color: #115236 !important; color: white; }
        .btn-verde { background-color: #115236; color: white; border: none; }
        .btn-verde:hover { background-color: #0b3624; color: white; }
        .border-dorado { border: 2px solid #BC955C !important; }
        .card-login {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-top: 6px solid #115236;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 450px;">
        <div class="card card-login p-4">
            <div class="text-center mb-4">
                <h3 class="text-guinda fw-bold mb-0">Portal del Jurado</h3>
                <small class="text-muted fw-bold">1er Concurso Nacional de Huapango</small>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center fw-bold py-2 shadow-sm">
                ❌ {{ error }}
            </div>
            {% endif %}

            <form action="/procesar_login_juez" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Usuario Asignado</label>
                    <input type="text" class="form-control" name="usuario" placeholder="Ej. juez1" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña de Acceso</label>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-verde w-100 fw-bold btn-lg shadow-sm">Ingresar a Calificar</button>
            </form>
        </div>
        <footer class="text-center mt-3 text-muted">
            <small>Sistema Exclusivo de Calificación H. Ayuntamiento 2026</small>
        </footer>
    </div>

</body>
</html>
